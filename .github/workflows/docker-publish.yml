name: Docker publish

# Builds the application images and pushes them to the single Docker Hub
# repo fforzano99/xgsail, tagged <service>-latest and
# <service>-sha-<short-sha>. Mirrors scripts/build-images.sh's
# context/dockerfile pairs. Watchtower on the VM polls *-latest and
# redeploys on its own — this workflow only publishes.
#
# ota-service is a container too, so it rides the same build-and-push +
# Watchtower flow as backend/frontend/workers. The native app's JS bundle
# is a different kind of artifact (not a container Watchtower can restart
# into existence on a phone) — deploy-ota publishes it separately via
# scripts/deploy-ota.sh whenever frontend/ changes, so the already-installed
# native app self-updates on next launch. See docs/ota-updates.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DOCKERHUB_REPO: fforzano99/xgsail

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  # Gates everything downstream: `publish` and `deploy-ota` both `needs: test`,
  # so a red result here is unpublishable by construction.
  #
  # The migration steps below exist because the pytest suite is entirely
  # database-free (pure functions), which once let a migration and its
  # SQLAlchemy model ship to production out of sync: RegattaEntryORM declared
  # a column that migration 0043 never created, so every SELECT of that model
  # raised UndefinedColumn and all /api/regattas/{id}/entries routes 500'd.
  # Nothing in CI executed a migration or compared the physical schema to the
  # ORM metadata, so nothing noticed. These steps do both, against a real
  # Postgres matching docker-compose.yml's major version.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sailframes
          POSTGRES_PASSWORD: sailframes
          POSTGRES_DB: sailframes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sailframes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # backend/db/__init__.py::_build_url() reads these; backend/alembic/env.py
      # reuses it, so migrations and the app never diverge on connection config.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sailframes
      POSTGRES_PASSWORD: sailframes
      POSTGRES_DB: sailframes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + worker deps
        run: |
          pip install --no-cache-dir -r deploy/requirements.txt
          pip install --no-cache-dir -r workers/process_upload/requirements.txt
          pip install --no-cache-dir ./libs/xgsail_windfusion
          pip install --no-cache-dir pytest

      # From an empty database, so every revision executes in order — this
      # alone catches a migration that errors or references a column an
      # earlier revision forgot to add.
      - name: Migrations — upgrade head from an empty database
        run: alembic -c backend/alembic.ini upgrade head

      # Verified empirically to flag an ORM-declared column absent from the
      # physical schema (the exact 0043 failure mode), not just table-level
      # differences: it reports "Detected added column ...", non-zero exit.
      - name: Migrations — no drift between schema and ORM metadata
        run: alembic -c backend/alembic.ini check

      # Every downgrade() must actually run, not just exist. Round-tripping
      # back to head afterwards keeps this from leaving a torn-down schema.
      - name: Migrations — downgrade to base and back
        run: |
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head

      - name: Backend tests
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck + build
        working-directory: frontend
        run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: deploy/Dockerfile.backend
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - service: process-upload
            context: .
            dockerfile: workers/process_upload/Dockerfile
          - service: video
            context: ./workers/video
            dockerfile: workers/video/Dockerfile
          - service: ota-service
            context: .
            dockerfile: ota-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ matrix.service }}-latest
            ${{ env.DOCKERHUB_REPO }}:${{ matrix.service }}-sha-${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_REPO }}:${{ matrix.service }}-latest
          cache-to: type=inline

  # Publishes the native app's JS bundle via scripts/deploy-ota.sh whenever
  # frontend/ changes on main. Independent of the `publish` job above: this
  # doesn't touch a container image, it uploads straight to the production
  # MinIO (over its public endpoint) so ota-service can serve the new
  # manifest immediately — no Watchtower/redeploy involved on this path.
  deploy-ota:
    needs: [changes, test]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install MinIO client (mc)
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: Publish OTA update
        env:
          OTA_API_BASE: ${{ secrets.OTA_API_BASE }}
          SAILFRAMES_S3_ENDPOINT: ${{ secrets.SAILFRAMES_S3_PUBLIC_ENDPOINT }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SAILFRAMES_BUCKET: ${{ secrets.SAILFRAMES_BUCKET }}
        run: scripts/deploy-ota.sh
